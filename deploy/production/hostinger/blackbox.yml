modules:
  https_security_headers:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      method: GET
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      fail_if_header_not_matches:
        - header: Strict-Transport-Security
          regexp: .+
        - header: Content-Security-Policy
          regexp: .+
        - header: X-Content-Type-Options
          regexp: ^nosniff$

  https_api_ready:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      method: GET
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"status"\s*:\s*"ready"']

  https_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 204]
      method: GET
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4

  https_reachable:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 204, 301, 302, 307, 308, 400, 401, 403, 404, 405]
      method: GET
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4

  https_origin_denied:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [404]
      method: GET
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
