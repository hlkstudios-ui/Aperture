services:
  studio-gateway:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_APP_ORIGIN: "${PUBLIC_APP_ORIGIN}"
      PUBLIC_APP_HOST: "${PUBLIC_APP_HOST}"
      ORIGIN_EDGE_SECRET: "${ORIGIN_EDGE_SECRET}"
      STUDIO_EDGE_SECRET: "${STUDIO_EDGE_SECRET}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - "/tmp:size=16m,mode=0700,uid=65532,gid=65532"
      - "/config:size=16m,mode=0700,uid=65532,gid=65532"
      - "/data:size=16m,mode=0700,uid=65532,gid=65532"
