services:
  studio-gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../../../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /config:size=16m,mode=0700
      - /data:size=16m,mode=0700
