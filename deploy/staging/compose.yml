name: aperture-staging

x-api-environment: &api-environment
  APP_ENV: staging
  WEB_ORIGIN: ${STAGING_WEB_ORIGIN}
  API_ORIGIN: ${STAGING_API_ORIGIN}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${STAGING_STORAGE_ORIGIN}
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_COOKIE_DOMAIN: ${STAGING_COOKIE_DOMAIN}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_USERNAME: ${SMTP_USERNAME}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
  SMTP_STARTTLS: "false"
  BILLING_PROVIDER: staging_unconfigured
  ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN}
  QUEUE_BACKLOG_ALERT_THRESHOLD: 25
  QUEUED_JOB_AGE_ALERT_SECONDS: 300
  PROCESSING_FAILURE_ALERT_THRESHOLD: 3
  FEATURE_SCENE_LENS_ENABLED: ${FEATURE_SCENE_LENS_ENABLED:-true}
  FEATURE_ASK_MOVIE_ENABLED: ${FEATURE_ASK_MOVIE_ENABLED:-true}
  FEATURE_COMMUNITY_ENABLED: ${FEATURE_COMMUNITY_ENABLED:-true}
  FEATURE_WATCH_PARTIES_ENABLED: ${FEATURE_WATCH_PARTIES_ENABLED:-true}
  FEATURE_EXPERIMENTAL_RECOMMENDATIONS_ENABLED: ${FEATURE_EXPERIMENTAL_RECOMMENDATIONS_ENABLED:-true}
  MALWARE_SCANNER_MODE: eicar
  MALWARE_SCANNER_PORT: 3310
  MALWARE_SCANNER_TIMEOUT_SECONDS: 30
  PLAYBACK_LEASE_SECONDS: 300
  GEO_ASSERTION_SECRET: ${GEO_ASSERTION_SECRET}
  GEO_ASSERTION_MAX_AGE_SECONDS: 120
  MEDIA_JOB_LEASE_SECONDS: 300
  MEDIA_JOB_MAX_ATTEMPTS: 3
  SCENE_JOB_LEASE_SECONDS: 300
  SCENE_JOB_MAX_ATTEMPTS: 3
  REGISTRATION_RATE_LIMIT_PER_HOUR: 100

x-api-service: &api-service
  image: aperture-api:staging
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  restart: unless-stopped
  environment: *api-environment
  depends_on:
    migrate: { condition: service_completed_successfully }
    minio-init: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  networks: [private]

services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["staging-postgres:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${STAGING_POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:8.8.1-alpine3.23
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: ["staging-redis:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${STAGING_WEB_ORIGIN}
    volumes: ["staging-minio:/data"]
    ports: ["127.0.0.1:${STAGING_MINIO_PORT:-59000}:9000"]
    networks: [private]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on: [minio]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        until mc alias set staging http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing "staging/$${S3_BUCKET}"
        mc version enable "staging/$${S3_BUCKET}"
        mc anonymous set none "staging/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    networks: [private]

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:${STAGING_MAILPIT_PORT:-58025}:8025"]
    networks: [private]

  migrate:
    image: aperture-api:staging
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: [alembic, upgrade, head]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]

  api:
    <<: *api-service
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 20

  media-worker:
    <<: *api-service
    command: [python, -m, app.media_worker]

  scene-worker:
    <<: *api-service
    command: [python, -m, app.scene_worker]

  web:
    image: aperture-web:staging
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:8000
        NEXT_PUBLIC_API_ORIGIN: ${STAGING_API_ORIGIN}
        NEXT_PUBLIC_OBJECT_STORAGE_ORIGIN: ${STAGING_STORAGE_ORIGIN}
        NEXT_PUBLIC_MEDIA_ORIGIN: ${STAGING_API_ORIGIN}
        NEXT_PUBLIC_FEATURE_SCENE_LENS_ENABLED: ${FEATURE_SCENE_LENS_ENABLED:-true}
        NEXT_PUBLIC_FEATURE_ASK_MOVIE_ENABLED: ${FEATURE_ASK_MOVIE_ENABLED:-true}
        NEXT_PUBLIC_FEATURE_COMMUNITY_ENABLED: ${FEATURE_COMMUNITY_ENABLED:-true}
        NEXT_PUBLIC_FEATURE_WATCH_PARTIES_ENABLED: ${FEATURE_WATCH_PARTIES_ENABLED:-true}
        NEXT_PUBLIC_FEATURE_EXPERIMENTAL_RECOMMENDATIONS_ENABLED: ${FEATURE_EXPERIMENTAL_RECOMMENDATIONS_ENABLED:-true}
        WEB_ORIGIN: ${STAGING_WEB_ORIGIN}
        POLICY_REQUIRE_APPROVED: "false"
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:8000
      NEXT_PUBLIC_API_ORIGIN: ${STAGING_API_ORIGIN}
      NEXT_PUBLIC_OBJECT_STORAGE_ORIGIN: ${STAGING_STORAGE_ORIGIN}
      NEXT_PUBLIC_MEDIA_ORIGIN: ${STAGING_API_ORIGIN}
      NEXT_PUBLIC_FEATURE_SCENE_LENS_ENABLED: ${FEATURE_SCENE_LENS_ENABLED:-true}
      NEXT_PUBLIC_FEATURE_ASK_MOVIE_ENABLED: ${FEATURE_ASK_MOVIE_ENABLED:-true}
      NEXT_PUBLIC_FEATURE_COMMUNITY_ENABLED: ${FEATURE_COMMUNITY_ENABLED:-true}
      NEXT_PUBLIC_FEATURE_WATCH_PARTIES_ENABLED: ${FEATURE_WATCH_PARTIES_ENABLED:-true}
      NEXT_PUBLIC_FEATURE_EXPERIMENTAL_RECOMMENDATIONS_ENABLED: ${FEATURE_EXPERIMENTAL_RECOMMENDATIONS_ENABLED:-true}
      WEB_ORIGIN: ${STAGING_WEB_ORIGIN}
      POLICY_REQUIRE_APPROVED: "false"
    depends_on:
      api: { condition: service_healthy }
    networks: [private]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["${STAGING_HTTPS_PORT:-8443}:443"]
    environment:
      STAGING_WEB_HOST: ${STAGING_WEB_HOST}
      STAGING_API_HOST: ${STAGING_API_HOST}
      STAGING_STORAGE_HOST: ${STAGING_STORAGE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staging-caddy-data:/data
      - staging-caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    networks: [private]

networks:
  private:
    internal: false

volumes:
  staging-postgres:
  staging-redis:
  staging-minio:
  staging-caddy-data:
  staging-caddy-config:
