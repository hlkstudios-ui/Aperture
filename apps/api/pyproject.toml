[project]
name = "apex-cinema-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "authlib==1.6.12",
  "boto3==1.42.54",
  "cryptography==50.0.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "idna==3.19",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.3",
  "pydantic-settings==2.14.2",
  "pyyaml==6.0.3",
  "pyotp==2.10.0",
  "redis==7.3.0",
  "sentry-sdk[fastapi]==2.68.0",
  "sqlalchemy==2.0.52",
  "stripe==13.2.0",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "pip-audit==2.10.1",
  "pip-tools==7.6.1",
  "pytest==9.0.3",
  "ruff==0.15.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
